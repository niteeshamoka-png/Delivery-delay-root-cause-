<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DelayLens – Delivery delay root-cause agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEFF2;--surface:#FFFFFF;--surface2:#F4F6F8;--ink:#0F1F2A;--muted:#566873;--line:#D2D9DF;
  --accent:#2347E8;--accent-ink:#FFFFFF;--bad:#C93A2E;--good:#14806B;--warn:#A86B00;
  --s1:#5B6CFF;--s2:#9AA9B8;--s3:#E0A100;--s4:#1AA38C;--s5:#D2493D;
  --font-d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--font-b:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151B;--surface:#14202A;--surface2:#1A2832;--ink:#E8EEF2;--muted:#93A4B0;--line:#27374292;
  --accent:#8AA0FF;--accent-ink:#0B1220;--bad:#FF7F73;--good:#4CC9AC;--warn:#E8B04B;
  --s1:#7886FF;--s2:#6F8294;--s3:#E8B04B;--s4:#3CC2AA;--s5:#F0695D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151B;--surface:#14202A;--surface2:#1A2832;--ink:#E8EEF2;--muted:#93A4B0;--line:#273742;
  --accent:#8AA0FF;--accent-ink:#0B1220;--bad:#FF7F73;--good:#4CC9AC;--warn:#E8B04B;
  --s1:#7886FF;--s2:#6F8294;--s3:#E8B04B;--s4:#3CC2AA;--s5:#F0695D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font-b);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-d);margin:0;line-height:1.15;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1320px;margin:0 auto;padding:0 20px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font:700 21px/1 var(--font-d)}
.brand span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;min-height:32px;font-size:13.5px}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select.btn{padding-right:8px}
.layout{display:grid;grid-template-columns:288px minmax(0,1fr);gap:28px;align-items:start}
.crew{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 14px 6px}
.crew-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.crew-h h2{font-size:16px}
.crew-toggle{display:none}
.agent{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--line);border:1.5px solid var(--muted)}
.agent.running .dot{background:var(--accent);border-color:var(--accent);animation:pulse 1s ease-in-out infinite}
.agent.done .dot{background:var(--good);border-color:var(--good)}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}}
.agent b{font-weight:600;font-size:14px}
.agent p{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.agent.done p{color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.lede{font-size:clamp(26px,3.4vw,40px);max-width:24em;margin-bottom:22px}
.sub{color:var(--muted);max-width:60ch;margin:0 0 20px}
.stats{display:flex;flex-wrap:wrap;gap:12px 40px;margin:0 0 34px;padding:0}
.stats div{min-width:110px}
.stats dt{color:var(--muted);font-size:13px}
.stats dd{margin:0;font:700 28px/1.2 var(--font-d)}
.stats dd.bad{color:var(--bad)}
.block{margin:0 0 36px}
.block h2{font-size:20px;margin-bottom:4px}
.block .note{color:var(--muted);font-size:13.5px;margin:0 0 14px;max-width:70ch}
.bars{display:grid;gap:14px}
.barrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.barrow>span{font-size:13.5px;color:var(--muted)}
.stack{display:flex;height:46px;border-radius:6px;overflow:hidden;background:var(--surface2)}
.seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.read{margin-top:12px;max-width:70ch}
.heat-wrap{overflow-x:auto;padding-bottom:6px}
.heat{display:grid;grid-template-columns:96px repeat(12,minmax(42px,1fr));gap:3px;min-width:640px}
.heat .rl{font-size:13px;display:flex;align-items:center}
.heat .cl{font-size:12px;color:var(--muted);text-align:center}
.heat .c{height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--surface2);color:var(--muted)}
.heat .c.hot{color:var(--ink)}
.console{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 16px;max-width:760px}
.console li{list-style:none;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.console li:first-child{border-top:0}
.console ul{margin:0;padding:0}
.console li b{font-weight:600}
.intro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 32px;margin:28px 0 0;max-width:860px}
.intro-grid dt{font-weight:600}
.intro-grid dd{margin:2px 0 0;color:var(--muted);font-size:14px}
.runbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.runbar label{color:var(--muted);font-size:14px}
.empty{padding:40px 0;color:var(--muted)}
details.plain{border-top:1px solid var(--line);padding:10px 0}
details.plain summary{cursor:pointer;font-weight:500}
.cause{border-top:1px solid var(--line);padding:18px 0}
.cause-top{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px}
.pctbig{font:700 30px/1 var(--font-d)}
.cause h3{font-size:18px}
.cause .hl{margin:4px 0 8px}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--accent)}
.meta{color:var(--muted);font-size:13.5px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.tbl th,.tbl td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:500}
.tbl td.n,.tbl th.n{text-align:right}
.tblwrap{overflow-x:auto}
.fixgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:32px;align-items:start}
.sumpanel{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.sumpanel h2{font-size:17px;margin-bottom:10px}
.before-after{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.before-after .a{font:700 34px/1 var(--font-d);color:var(--good)}
.before-after .b{font:600 18px/1 var(--font-d);color:var(--muted);text-decoration:line-through}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:14px 0 0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
.fine{color:var(--muted);font-size:12.5px;margin-top:12px}
.lever{border-top:1px solid var(--line);padding:18px 0}
.lever-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.lever-h label{font:600 17px/1.3 var(--font-d)}
.lever-h output{font-weight:600;white-space:nowrap}
.lever input[type=range]{width:100%;margin:12px 0 6px;accent-color:var(--accent)}
.hint{margin:0 0 10px;color:var(--muted);font-size:13.5px;max-width:64ch}
.lever-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted)}
.chip.pending{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.approved,.chip.auto{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.rejected{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.risk{font-size:12.5px;color:var(--muted)}
.fixbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chat{max-width:780px}
.msgs{display:grid;gap:12px;margin-bottom:16px}
.msg{padding:12px 14px;border-radius:8px;max-width:92%;white-space:pre-wrap}
.msg.u{background:var(--accent);color:var(--accent-ink);justify-self:end}
.msg.a{background:var(--surface);border:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.chips button:hover{border-color:var(--accent)}
.askbar{display:flex;gap:8px}
.askbar textarea{flex:1;min-height:44px;resize:vertical;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:9}
@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .crew{position:static}
  .crew-toggle{display:inline-block}
  .crew.collapsed .crew-list{display:none}
  .fixgrid{grid-template-columns:minmax(0,1fr)}
  .sumpanel{position:static;order:-1}
  .barrow{grid-template-columns:1fr}
}
@media (max-width:520px){.app{padding:0 14px 48px}.cause-top{grid-template-columns:1fr}.stats dd{font-size:24px}}
@media (prefers-reduced-motion:reduce){.agent.running .dot{animation:none}}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="13" fill="none" stroke="var(--ink)" stroke-width="3"/><path d="M17 8v9l6 4" fill="none" stroke="var(--bad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>DelayLens</b><span>Finds why orders arrive late and tests the fix</span></div>
    </div>
    <div class="top-right">
      <label for="role" class="meta">Signed in as</label>
      <select id="role" class="btn"><option value="analyst">Operations analyst</option><option value="manager">Operations manager</option></select>
      <button class="btn primary" id="runBtn">Run analysis</button>
    </div>
  </header>
  <div class="layout">
    <aside class="crew collapsed" id="crew"></aside>
    <main>
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
</div>
<script>
/* ===== ENGINE: synthetic data + analysis agents ===== */
const SCALE = 20, PROD = 8, DAYS = 14, TARGET_UTIL = 0.85;
const COST = { lateOrder: 180, staffShift: 900, skuMove: 2500, trip: 1500, carrierOrder: 6 };
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const WH = [
  {id:'DEL',name:'Delhi NCR',x:700,y:1700,staff:[20,34,14],cutoff:3},
  {id:'MUM',name:'Mumbai',x:250,y:900,staff:[20,32,14],cutoff:12},
  {id:'HYD',name:'Hyderabad',x:650,y:650,staff:[18,30,12],cutoff:2},
  {id:'BLR',name:'Bengaluru',x:600,y:250,staff:[16,13,12],cutoff:3},
  {id:'CHN',name:'Chennai',x:900,y:230,staff:[14,24,10],cutoff:3},
  {id:'KOL',name:'Kolkata',x:1400,y:1100,staff:[12,22,10],cutoff:4}
];
const ZONES = [
  {n:'Delhi',x:700,y:1720,w:10,car:'Kestrel Express'},{n:'Gurugram',x:680,y:1690,w:6,car:'Kestrel Express'},{n:'Jaipur',x:520,y:1520,w:4,car:'Kestrel Express'},
  {n:'Mumbai',x:250,y:900,w:10,car:'Roadrunner'},{n:'Pune',x:330,y:830,w:6,car:'Roadrunner'},{n:'Ahmedabad',x:150,y:1250,w:4,car:'Roadrunner'},
  {n:'Hyderabad',x:650,y:650,w:9,car:'MetroPost'},{n:'Vijayawada',x:850,y:640,w:3,car:'MetroPost'},{n:'Nagpur',x:650,y:1000,w:3,car:'Roadrunner'},
  {n:'Bengaluru',x:600,y:250,w:10,car:'MetroPost'},{n:'Mysuru',x:520,y:150,w:3,car:'MetroPost'},
  {n:'Chennai',x:900,y:230,w:8,car:'MetroPost'},{n:'Coimbatore',x:620,y:120,w:3,car:'MetroPost'},
  {n:'Kolkata',x:1400,y:1100,w:7,car:'SwiftLine'},{n:'Bhubaneswar',x:1250,y:820,w:3,car:'SwiftLine'},{n:'Guwahati',x:1700,y:1300,w:3,car:'SwiftLine'}
];
const HOURW = [1,.6,.4,.3,.3,.5,1,2,3,3.5,3.5,3,3,3,3,3.2,3.5,4.5,6,7,7,6,4,2];
const CATS = ['Mobiles','Home','Fashion','Beauty','Grocery','Electronics'];
const STAGES = [['proc','Pick queue'],['pack','Pick and pack'],['disp','Dispatch wait'],['trans','Transit'],['last','Last mile']];
const shiftOf = h => h>=6&&h<14?0:(h>=14&&h<22?1:2);
const SHIFTN = ['morning','evening','night'];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const med = a => {const s=[...a].sort((x,y)=>x-y);return s.length?s[Math.floor(s.length/2)]:0};
const sum = a => a.reduce((x,y)=>x+y,0);
const mean = a => a.length?sum(a)/a.length:0;

function generate(N, seed){
  const r = rng(seed);
  const gauss=()=>Math.sqrt(-2*Math.log(r()+1e-12))*Math.cos(2*Math.PI*r());
  const logN=s=>Math.exp(gauss()*s - s*s/2);
  const cum = a => {let t=0;return a.map(v=>t+=v)};
  const pickC = c => {const x=r()*c[c.length-1];let i=0;while(c[i]<x)i++;return i};
  const hourC=cum(HOURW), zoneC=cum(ZONES.map(z=>z.w));
  const NSKU=48; const skuC=cum([...Array(NSKU)].map((_,i)=>1/Math.pow(i+1,.9)));
  const skuCat=[...Array(NSKU)].map((_,i)=>CATS[i%CATS.length]);
  const skuName=i=>`SKU-${String(i+1).padStart(3,'0')} (${skuCat[i]})`;
  const P = WH.map((w,k)=>[...Array(NSKU)].map((_,s)=>{
     if((w.id==='HYD'||w.id==='CHN') && s<12) return w.id==='HYD'?.5:.55;
     return .93+r()*.05;}));
  ZONES.forEach(z=>{z.rank=WH.map((w,k)=>k).sort((a,b)=>dist(z,WH[a])-dist(z,WH[b]));z.nearD=dist(z,WH[z.rank[0]]);});
  const list=[];
  for(let i=0;i<N;i++){
    const day=Math.floor(r()*DAYS), hour=pickC(hourC), zi=pickC(zoneC), z=ZONES[zi], sku=pickC(skuC);
    let w=-1; for(const k of z.rank){ if(r()<P[k][sku]){w=k;break} } if(w<0) w=z.rank[z.rank.length-1];
    list.push({id:'ORD-'+(100000+i),day,hour,z:zi,zone:z.n,sku,w,near:z.rank[0],remote:w!==z.rank[0],car:z.car,u:r()});
  }
  const load={}; list.forEach(o=>{const k=o.w+'|'+o.day+'|'+o.hour;load[k]=(load[k]||0)+1});
  const L=(w,d,h)=>load[w+'|'+d+'|'+((h+24)%24)]||0;
  list.forEach(o=>{
    const shift=shiftOf(o.hour); o.shift=shift;
    const l3=(L(o.w,o.day,o.hour-1)+L(o.w,o.day,o.hour)+L(o.w,o.day,o.hour+1))/3;
    o.util=l3*SCALE/(WH[o.w].staff[shift]*PROD);
    const zone=ZONES[o.z];
    o.proc = 1.0*logN(.35) + (o.util>.9 ? 9*(o.util-.9)*logN(.3) : 0);
    o.pack = 1.2*logN(.3);
    o.disp = r()*WH[o.w].cutoff;
    o.trans = dist(zone,WH[o.w])/45*logN(.15)+2;
    o.transExp = zone.nearD/45+2;
    o.last = 4.5*logN(.35) + (o.car==='SwiftLine' && (zone.n==='Kolkata'||zone.n==='Bhubaneswar'||zone.n==='Guwahati') && r()<.55 ? 7+r()*8 : 0);
    o.promise = 13 + 1.3*o.transExp;
    o.actual = o.proc+o.pack+o.disp+o.trans+o.last;
    o.delay = o.actual - o.promise;
    o.late = o.delay>0;
  });
  return {orders:list, skuName};
}

function analyse(data){
  const {orders:O, skuName}=data, N=O.length;
  const late=O.filter(o=>o.late);
  const R={N,late:late.length,lateRate:late.length/N,delayHours:sum(late.map(o=>o.delay)),skuName};
  R.avgLate=mean(late.map(o=>o.delay));
  R.stageAvg={ontime:STAGES.map(([k])=>mean(O.filter(o=>!o.late).map(o=>o[k]))),late:STAGES.map(([k])=>mean(late.map(o=>o[k])))};
  // heatmap warehouse x 2h bucket
  R.heat=WH.map((w,k)=>[...Array(12)].map((_,b)=>{const s=O.filter(o=>o.w===k&&Math.floor(o.hour/2)===b);return {n:s.length,rate:s.length>=12?s.filter(o=>o.late).length/s.length:null}}));
  // benchmarks
  const medDisp=med(O.map(o=>o.disp)), medLast=med(O.map(o=>o.last)), medProc=med(O.map(o=>o.proc));
  const dispByWh=WH.map((w,k)=>mean(O.filter(o=>o.w===k).map(o=>o.disp)));
  const dispNet=mean(O.map(o=>o.disp));
  const flagWh=dispByWh.map(v=>v>1.25*dispNet);
  const cz={}; O.forEach(o=>{const k=o.car+'|'+o.zone;(cz[k]=cz[k]||[]).push(o.last)});
  const lastNet=mean(O.map(o=>o.last));
  const flagCZ=new Set(Object.keys(cz).filter(k=>mean(cz[k])>1.25*lastNet));
  O.forEach(o=>{
    o.czKey=o.car+'|'+o.zone;
    o.x={staff:o.util>.9?Math.max(0,o.proc-medProc):0, stock:o.remote?Math.max(0,o.trans-o.transExp):0,
         batch:flagWh[o.w]?Math.max(0,o.disp-medDisp):0, carrier:flagCZ.has(o.czKey)?Math.max(0,o.last-medLast):0};
    o.a={staff:0,stock:0,batch:0,carrier:0,other:0};
    if(o.late){
      const E=o.x.staff+o.x.stock+o.x.batch+o.x.carrier;
      if(E>=o.delay){for(const c in o.x)o.a[c]=o.delay*o.x[c]/E}
      else{for(const c in o.x)o.a[c]=o.x[c];o.a.other=o.delay-E}
    }
  });
  const tot=c=>sum(late.map(o=>o.a[c]));
  const grp=(arr,keyf)=>{const m={};arr.forEach(o=>{const k=keyf(o);(m[k]=m[k]||[]).push(o)});return m};
  // staffing segments
  const sg=grp(O.filter(o=>o.util>.9),o=>o.w+'|'+o.shift);
  const staffSegs=Object.entries(sg).map(([k,s])=>{const [w,sh]=k.split('|').map(Number);const u=mean(s.map(o=>o.util));
     return {key:k,w,shift:sh,wh:WH[w].name,shiftName:SHIFTN[sh],orders:s.length,util:u,staff:WH[w].staff[sh],need:Math.max(1,Math.ceil(WH[w].staff[sh]*(u/TARGET_UTIL-1))),hours:sum(s.map(o=>o.a.staff)),lateRate:s.filter(o=>o.late).length/s.length}})
     .filter(s=>s.orders>=25&&s.hours>=40).sort((a,b)=>b.hours-a.hours);
  // stock segments
  const kg=grp(O.filter(o=>o.remote),o=>o.sku);
  const skuSegs=Object.entries(kg).map(([k,s])=>({sku:+k,name:skuName(+k),orders:s.length,hours:sum(s.map(o=>o.a.stock)),nearWh:mode(s.map(o=>WH[o.near].name))})).sort((a,b)=>b.hours-a.hours);
  let cumH=0;const totStock=sum(skuSegs.map(s=>s.hours))||1;skuSegs.forEach(s=>{cumH+=s.hours;s.cum=cumH/totStock});
  const nearSegs=Object.entries(grp(O.filter(o=>o.remote),o=>WH[o.near].name)).map(([k,s])=>({name:k,orders:s.length,share:s.length/O.filter(o=>o.near===WH.findIndex(w=>w.name===k)).length})).sort((a,b)=>b.share-a.share);
  // batch segments
  const batchSegs=WH.map((w,k)=>({wh:w.name,k,cutoff:w.cutoff,meanWait:dispByWh[k],flag:flagWh[k],hours:sum(late.filter(o=>o.w===k).map(o=>o.a.batch))})).filter(s=>s.flag).sort((a,b)=>b.hours-a.hours);
  // carrier segments
  const cgp=grp(O.filter(o=>flagCZ.has(o.czKey)),o=>o.czKey);
  const carSegs=Object.entries(cgp).map(([k,s])=>({key:k,car:k.split('|')[0],zone:k.split('|')[1],orders:s.length,meanLast:mean(s.map(o=>o.last)),hours:sum(s.map(o=>o.a.carrier))})).sort((a,b)=>b.hours-a.hours);
  R.lastNet=lastNet; R.dispNet=dispNet;
  R.remoteShare=O.filter(o=>o.remote).length/N;
  R.segs={staff:staffSegs,stock:skuSegs,near:nearSegs,batch:batchSegs,car:carSegs};
  const top=(a)=>a[0];
  const causes=[
   {id:'staff',title:'Warehouse shifts running above capacity',hours:tot('staff'),
    headline:staffSegs.length?`${staffSegs[0].wh} ${staffSegs[0].shiftName} shift runs at ${Math.round(staffSegs[0].util*100)}% load with ${staffSegs[0].staff} pickers`:'No overloaded shifts found'},
   {id:'stock',title:'Orders shipped from a far warehouse because local stock is missing',hours:tot('stock'),
    headline:`${(R.remoteShare*100).toFixed(0)}% of orders left a warehouse other than the nearest one; ${nearSegs[0]?nearSegs[0].name:'-'} misses stock most often`},
   {id:'batch',title:'Slow dispatch cycles hold packed orders',hours:tot('batch'),
    headline:batchSegs.length?`${batchSegs[0].wh} releases trucks every ${batchSegs[0].cutoff} hours; packed orders wait ${batchSegs[0].meanWait.toFixed(1)}h on average`:'No slow dispatch cycles found'},
   {id:'carrier',title:'Carrier last-mile failures in specific zones',hours:tot('carrier'),
    headline:carSegs.length?`${carSegs[0].car} takes ${carSegs[0].meanLast.toFixed(1)}h in ${carSegs[0].zone} versus ${lastNet.toFixed(1)}h network average`:'No weak carrier zones found'}
  ];
  causes.forEach(c=>{c.share=c.hours/R.delayHours;c.affected=O.filter(o=>o.x[c.id]>0).length;
    const w=O.filter(o=>o.x[c.id]>0), wo=O.filter(o=>o.x[c.id]===0);
    c.lateWith=w.length?w.filter(o=>o.late).length/w.length:0;c.lateWithout=wo.length?wo.filter(o=>o.late).length/wo.length:0;c.lift=c.lateWithout?c.lateWith/c.lateWithout:0;});
  causes.sort((a,b)=>b.hours-a.hours);
  R.causes=causes; R.otherHours=sum(late.map(o=>o.a.other)); R.otherShare=R.otherHours/R.delayHours;
  R.O=O; return R;
}
function mode(a){const m={};a.forEach(x=>m[x]=(m[x]||0)+1);return Object.entries(m).sort((x,y)=>y[1]-x[1])[0][0]}

/* what-if projection */
function recommended(R){
  const needs=R.segs.staff.slice(0,3).map(s=>s.need);
  const flagged=R.segs.batch.length?Math.min(...R.segs.batch.map(b=>Math.max(2,Math.round(b.cutoff/2.2)))):8;
  return {staff:Math.min(12,Math.max(...needs,0)), sku:Math.min(30,(R.segs.stock.findIndex(s=>s.cum>=.7)+1)||12), dispatch:flagged, carrier:70, eta:0};
}
function project(R,lv){
  const segNeed={};R.segs.staff.forEach(s=>segNeed[s.key]=s.need);
  const topSku=new Set(R.segs.stock.slice(0,lv.sku).map(s=>s.sku));
  const cutoffs=R.segs.batch.reduce((m,b)=>(m[b.k]=b.cutoff,m),{});
  let late=0,hours=0;
  R.O.forEach(o=>{
    let d=o.delay;
    if(o.x.staff){const need=segNeed[o.w+'|'+o.shift]||0;if(need)d-=o.x.staff*Math.min(1,lv.staff/need)*.9}
    if(o.x.stock&&topSku.has(o.sku))d-=o.x.stock*.9;
    if(o.x.batch&&cutoffs[o.w]&&lv.dispatch<cutoffs[o.w])d-=o.x.batch*(1-lv.dispatch/cutoffs[o.w])*.95;
    if(o.x.carrier&&o.u<lv.carrier/100)d-=o.x.carrier*.85;
    if(o.remote&&lv.eta)d-=lv.eta;
    if(d>0){late++;hours+=d}
  });
  const monthly=SCALE*30/DAYS;
  const prevented=(R.late-late)*monthly; // late orders avoided per month
  const cStaff=R.segs.staff.reduce((a,s)=>a+Math.min(lv.staff,s.need),0)*COST.staffShift*30;
  const cSku=lv.sku*COST.skuMove;
  let cTrips=0;R.segs.batch.forEach(b=>{if(lv.dispatch<b.cutoff)cTrips+=(16/lv.dispatch-16/b.cutoff)*COST.trip*30});
  const carMoved=R.segs.car.reduce((a,s)=>a+s.orders,0)*lv.carrier/100*monthly;
  const cCar=carMoved*COST.carrierOrder;
  const cost=cStaff+cSku+cTrips+cCar;
  const saving=prevented*COST.lateOrder;
  return {lateRate:late/R.N,late,hours,prevented,cost,saving,net:saving-cost,costs:{staff:cStaff,stock:cSku,batch:cTrips,carrier:cCar}};
}

  for(const a of AGENTS){
    S.ag[a.id].st='running';render();await sleep(520);
    if(a.id==='data'){S.R=analyse(generate(S.orders,seed));S.rec=recommended(S.R);S.maxCut=Math.max(...S.R.segs.batch.map(b=>b.cutoff),8);S.lv={staff:0,sku:0,dispatch:S.maxCut,carrier:0,eta:0}}

}

   <div class="fixbar"><button class="btn primary" id="useRec">Use the agent's recommended plan</button><button class="btn" id="resetLv">Reset</button></div>
   ${LEVERS.map(L=>`<div class="lever" id="lv-${L.id}"><div class="lever-h"><label for="in-${L.id}">${L.title}</label><output id="out-${L.id}"></output></div>
     <input type="range" id="in-${L.id}" min="${L.min}" max="${L.max??S.maxCut}" step="${L.step}" value="${S.lv[L.id]}">
     <p class="hint" id="hint-${L.id}"></p><div class="lever-foot" id="foot-${L.id}"></div></div>`).join('')}
  </div><aside class="sumpanel" id="sum"></aside></div>`;
  LEVERS.forEach(L=>{$('#in-'+L.id).oninput=e=>{S.lv[L.id]=+e.target.value;refreshFix(false)}});
  $('#useRec').onclick=()=>{S.lv={...S.rec};LEVERS.forEach(L=>$('#in-'+L.id).value=S.lv[L.id]);addLog('Recommendation agent','Recommended plan loaded into the simulator.');refreshFix(true)};
  $('#resetLv').onclick=()=>{S.lv={staff:0,sku:0,dispatch:S.maxCut,carrier:0,eta:0};LEVERS.forEach(L=>$('#in-'+L.id).value=S.lv[L.id]);refreshFix(true)};
  refreshFix(true);
}
const atBase=id=>id==='dispatch'?S.lv.dispatch>=S.maxCut:S.lv[id]===0;
function refreshFix(feet){
  const R=S.R,p=project(R,S.lv),base=R.lateRate;
  LEVERS.forEach(L=>{$('#out-'+L.id).textContent=L.unit(S.lv[L.id]);$('#hint-'+L.id).textContent=hintFor(L.id);if(feet)footFor(L)});
  $('#sum').innerHTML=`<h2>Projected result</h2><div class="before-after"><span class="a">${pc(p.lateRate,1)}</span><span class="b">${pc(base,1)}</span></div><p class="meta" style="margin:0">of orders late</p>
   <dl class="kv"><dt>Late orders avoided each month</dt><dd>${Math.round(p.prevented).toLocaleString('en-IN')}</dd><dt>Delay hours left</dt><dd>${Math.round(p.hours).toLocaleString('en-IN')}</dd><dt>Estimated saving per month</dt><dd>${inr(p.saving)}</dd><dt>Estimated cost per month</dt><dd>${inr(p.cost)}</dd><dt>Net per month</dt><dd style="color:${p.net>=0?'var(--good)':'var(--bad)'}">${inr(p.net)}</dd></dl>
   <p class="fine">Illustrative assumptions: ₹${COST.lateOrder} cost per late order, ₹${COST.staffShift} per picker shift, ₹${COST.skuMove.toLocaleString('en-IN')} per SKU moved, ₹${COST.trip.toLocaleString('en-IN')} per extra truck run, ₹${COST.carrierOrder} extra per re-routed order. Volumes are scaled from the sample to a month. Replace with your real rates.</p>`;
}
function footFor(L){
  const st=S.appr[L.id]||'none',el=$('#foot-'+L.id);
  const chips={none:'Not submitted',pending:'Waiting for approval',approved:'Approved',rejected:'Rejected',auto:'Applied automatically'};
  let b='';
  if(L.risk==='low'){ if(st==='auto')b=`<button class="btn small" data-a="revert">Revert</button>`;else b=`<button class="btn small primary" data-a="auto" ${atBase(L.id)?'disabled':''}>Apply automatically</button>`}
  else if(st==='pending'){ b=S.role==='manager'?`<button class="btn small good" data-a="approve">Approve</button><button class="btn small danger" data-a="reject">Reject</button>`:`<span class="meta">Switch to Operations manager (top right) to approve.</span>`}
  else if(st==='approved'){b=`<button class="btn small" data-a="revert">Revert</button>`}
  else b=`<button class="btn small primary" data-a="submit" ${atBase(L.id)?'disabled':''}>Submit for approval</button>`;
  el.innerHTML=`<span class="chip ${st}">${chips[st]}</span><span class="risk">${RISKT[L.risk]}</span><span style="flex:1"></span>${b}`;
  el.querySelectorAll('button').forEach(btn=>btn.onclick=()=>act(L,btn.dataset.a));
}
function act(L,a){
  const val=L.unit(S.lv[L.id]);
  const m={submit:['pending','Orchestrator',`Submitted "${L.title}" (${val}) for manager approval.`],auto:['auto','Orchestrator',`Applied "${L.title}" (${val}) automatically as a low-risk change.`],
    approve:['approved',S.role==='manager'?'Operations manager':'Manager',`Approved "${L.title}" (${val}).`],reject:['rejected','Operations manager',`Rejected "${L.title}" (${val}).`],revert:['none','Orchestrator',`Reverted "${L.title}".`]}[a];
  S.appr[L.id]=m[0];addLog(m[1],m[2]);footFor(L);toast(m[2]);
}

/* ---------- ask ---------- */
function ctx(){const R=S.R,p=project(R,S.lv),rp=project(R,S.rec);
 return JSON.stringify({orders:R.N,lateRatePct:+(R.lateRate*100).toFixed(1),avgLatenessHours:+R.avgLate.toFixed(1),
  causes:R.causes.map(c=>({cause:c.title,sharePct:+(c.share*100).toFixed(1),finding:c.headline,lateWithCausePct:+(c.lateWith*100).toFixed(0),lateWithoutPct:+(c.lateWithout*100).toFixed(0)})),
  worstStaffShifts:R.segs.staff.slice(0,3).map(s=>({wh:s.wh,shift:s.shiftName,loadPct:Math.round(s.util*100),pickers:s.staff,extraNeeded:s.need})),
  topSkus:R.segs.stock.slice(0,5).map(s=>({sku:s.name,nearestWarehouseLacksIt:s.nearWh})),
  slowDispatch:R.segs.batch.map(b=>({wh:b.wh,truckEveryHours:b.cutoff})),weakCarrierZones:R.segs.car.map(s=>({carrier:s.car,zone:s.zone,lastMileHours:+s.meanLast.toFixed(1)})),
  simulatorNow:{levers:S.lv,projectedLateRatePct:+(p.lateRate*100).toFixed(1),netMonthlyINR:Math.round(p.net)},
  recommendedPlan:{levers:S.rec,projectedLateRatePct:+(rp.lateRate*100).toFixed(1),netMonthlyINR:Math.round(rp.net)}});}
const CHIPS=['What is the biggest cause of delays?','What should we fix first?','Why is the evening shift a problem?','What are the risks of changing carriers?'];
function rAsk(v){
  if(!S.done)return needRun(v);
  v.innerHTML=`<div class="chat"><h1 class="lede">Ask the agent about this analysis.</h1><p class="sub">Answers come from the numbers in this run, not from general knowledge.</p>
   <div class="chips">${CHIPS.map(c=>`<button data-q="${esc(c)}">${esc(c)}</button>`).join('')}</div>
   <div class="msgs" id="msgs"></div>
   <div class="askbar"><textarea id="q" rows="2" placeholder="Ask about a cause, a warehouse or a fix"></textarea><button class="btn primary" id="send">Ask</button></div></div>`;
  drawMsgs();
  document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>ask(b.dataset.q));
  $('#send').onclick=()=>{const t=$('#q').value.trim();if(t){$('#q').value='';ask(t)}};
  $('#q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#send').click()}};
}
function drawMsgs(){const m=$('#msgs');if(!m)return;m.innerHTML='';S.chat.forEach(x=>{const d=document.createElement('div');d.className='msg '+(x.r==='u'?'u':'a');d.textContent=x.t;m.appendChild(d)})}
function localAnswer(){const R=S.R,t=R.causes[0];return `The biggest cause is "${t.title.toLowerCase()}" at ${pc(t.share)} of delay hours. ${t.headline}. The live Q&A isn't available in this view, so this is the summary from the analysis. See the Root causes tab for the evidence.`}
async function ask(q){
  if(S.busy)return;S.busy=true;S.chat.push({r:'u',t:q});S.chat.push({r:'a',t:'Thinking…'});drawMsgs();
  const idx=S.chat.length-1;
  try{
    const sample=window.claude?await window.claude.use('sample'):null;
    if(!sample){S.chat[idx].t=localAnswer()}
    else{
      const hist=S.chat.slice(0,-2).slice(-6).map(x=>(x.r==='u'?'User: ':'Agent: ')+x.t).join('\n');
      const prompt=`You are DelayLens, an operations analyst agent for an e-commerce company with late deliveries despite enough logistics capacity. Answer using ONLY the analysis data below. Be specific, cite figures from the data, and answer in under 130 words in plain sentences with no headings or markdown. If the data cannot answer, say so and name the data that would help. Money is in Indian rupees. Actions that change staffing, stock, dispatch or carriers need a manager's approval.\n\nANALYSIS DATA:\n${ctx()}\n\nCONVERSATION SO FAR:\n${hist||'(none)'}\n\nUSER QUESTION: ${q}`;
      await sample(prompt,{cache:false,onText:({text})=>{S.chat[idx].t=text;drawMsgs()}});
    }
  }catch(e){S.chat[idx].t=e&&e.code==='not_granted'?localAnswer():'The agent could not answer just now. '+(e&&e.code==='rate_limited'?'Too many questions in a short time. Wait a moment and try again.':'Try again in a moment.')}
  S.busy=false;drawMsgs();
}

/* ---------- audit ---------- */
function rAudit(v){
  v.innerHTML=`<h1 class="lede">Every agent action and approval is recorded.</h1><p class="sub">Use this trail to review who approved a change and what the numbers looked like at the time.</p>`+
   (S.log.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Time</th><th>Actor</th><th>Action</th></tr></thead><tbody>${S.log.slice().reverse().map(l=>`<tr><td>${l.t}</td><td>${esc(l.who)}</td><td>${esc(l.text)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nothing recorded yet. Run the analysis to start the trail.</div>`);
}

$('#runBtn').onclick=runAnalysis;
$('#role').onchange=e=>{S.role=e.target.value;addLog('System','Role changed to '+(S.role==='manager'?'Operations manager':'Operations analyst')+'.');if(S.tab==='fix'&&S.done)LEVERS.forEach(footFor)};
render();
</script></body></html>
